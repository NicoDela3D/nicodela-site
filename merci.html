<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci — Nicolas Delacrétaz</title>
<meta name="description" content="Votre message est bien parti. Nicolas Delacrétaz vous répond rapidement.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Merci — Nicolas Delacrétaz">
<meta property="og:description" content="Votre message est bien parti. Nicolas Delacrétaz vous répond rapidement.">
<meta property="og:url" content="https://nicodela.ch/merci.html">
<meta property="og:image" content="https://nicodela.ch/img/full/001-vue-exterieure.jpg">
<meta property="og:image:width" content="2000">
<meta property="og:image:height" content="1500">
<meta property="og:locale" content="fr_CH">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/logo/favicon.png" type="image/png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/site.css">
<!-- Réglages (tailles et durées) : généré par « build.py html », après site.css pour
     que ses valeurs l'emportent. -->
<link rel="stylesheet" href="assets/css/reglages.css">
</head>
<body>
<header class="site-header">
  <!-- Bloc de gauche : les deux liens, et sous eux la rangée des filtres. Tous deux ne font
       qu'une seule case de la grille à trois colonnes — celle de gauche —, si bien que la rangée
       des filtres se pose juste sous le trait du lien actif au lieu d'attendre le bas de la bande
       du logo. Ce qui pend sous les liens fait grandir l'en-tête ; les liens, eux, ne bougent pas
       (voir `.header-left`, feuille de style). Sur écran étroit, le bloc se dissout
       (`display: contents`) et les deux liens reprennent chacun un côté du logo. -->
  <div class="header-left">
    <nav class="site-nav" aria-label="Navigation principale">
      <a href="./" class="">Mon travail</a>
      <a href="contact.html" class="is-active">Contact</a>
      <!-- Trait du lien actif. Il vient après les deux liens : c'est une décoration, elle n'a
           rien à dire à un lecteur d'écran, et `nav.js` lui donne la position et la largeur du
           lien actif — au chargement, au redimensionnement et à chaque fois qu'il change. -->
      <span class="nav-bar" aria-hidden="true"></span>
      <!-- Sans JavaScript, le trait reste large de zéro : personne ne le dimensionne, et le lien
           actif ne serait plus signalé du tout sur ordinateur (sur écran étroit, le soulignement
           de texte est déjà de retour). On rend donc le soulignement d'origine et on retire le
           trait, qui n'a plus rien à dire. -->
      <noscript><style>.site-nav a.is-active { text-decoration: underline; text-underline-offset: 5px; } .nav-bar { display: none; }</style></noscript>
    </nav>
    <!-- Rangée des filtres, juste sous les deux liens : `build_html` ne la pose que sur
         l'accueil, seule page qui ait une galerie à filtrer, et laisse le marqueur vide ailleurs.
         Elle vient avec sa rangée de sous-étiquettes, repliée tant que « Image » n'est pas
         choisi. -->
    
  </div>
  <a href="./" class="site-logo" aria-label="Nicolas Delacrétaz, retour à l'accueil">
    <img class="logo-fallback" src="assets/logo/logo-poster.png" data-gif="assets/logo/logo.gif" width="124" height="124" alt="">
    <noscript><style>.logo-fallback[data-gif]{display:none}</style><img class="logo-fallback" src="assets/logo/logo.gif" width="124" height="124" alt=""></noscript>
    <canvas id="logo" width="180" height="180" aria-hidden="true" hidden></canvas>
  </a>
</header>

<main class="contact">
  <h1>Merci</h1>
  <div class="contact-body">
    <p>Votre message est envoyé. Je vous réponds rapidement.</p>
    <p><a href="./">Retour aux images</a></p>
  </div>
</main>
<footer class="site-footer">
  <p>Nicolas Delacrétaz</p>
  <p>Place Grand-Saint-Jean 1</p>
  <p>CH - 1003 Lausanne</p>
</footer>

<!-- La barre du lien actif : posée avant les autres modules, pour qu'elle soit en place
     dès que « Contact » ouvre sa carte sur l'accueil. -->
<script type="module" src="assets/js/nav.js"></script>
<script type="module" src="assets/js/logo.js"></script>
<script type="module" src="assets/js/nav-float.js"></script>
</body>
</html>
