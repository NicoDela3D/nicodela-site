<!-- Les vignettes partent à `opacity: 0` et c'est `gallery.js` qui les révèle une à une.
     Sans lui, personne ne poserait `is-loaded` : la grille resterait blanche. -->
<noscript><style>.tile-front img, .tile-front video { opacity: 1; }</style></noscript>
</head>
<body>
<header class="site-header">
  <!-- Bloc de gauche : les deux liens, et sous eux la rangée des filtres. Tous deux ne font
       qu'une seule case de la grille à trois colonnes — celle de gauche —, si bien que la rangée
       des filtres se pose juste sous le trait du lien actif au lieu d'attendre le bas de la bande
       du logo. Ce qui pend sous les liens fait grandir l'en-tête ; les liens, eux, ne bougent pas
       (voir `.header-left`, feuille de style). Sur écran étroit, le bloc se dissout
       (`display: contents`) et les deux liens reprennent chacun un côté du logo. -->
  <div class="header-left">
    <nav class="site-nav" aria-label="Navigation principale">
      <a href="./" class="is-active">Mon travail</a>
      <a href="contact.html" class="">Contact</a>
      <!-- Trait du lien actif. Il vient après les deux liens : c'est une décoration, elle n'a
           rien à dire à un lecteur d'écran, et `nav.js` lui donne la position et la largeur du
           lien actif — au chargement, au redimensionnement et à chaque fois qu'il change. -->
      <span class="nav-bar" aria-hidden="true"></span>
      <!-- Sans JavaScript, le trait reste large de zéro : personne ne le dimensionne, et le lien
           actif ne serait plus signalé du tout sur ordinateur (sur écran étroit, le soulignement
           de texte est déjà de retour). On rend donc le soulignement d'origine et on retire le
           trait, qui n'a plus rien à dire. -->
      <noscript><style>.site-nav a.is-active { text-decoration: underline; text-underline-offset: 5px; } .nav-bar { display: none; }</style></noscript>
    </nav>
    <!-- Rangée des filtres, juste sous les deux liens : `build_html` ne la pose que sur
         l'accueil, seule page qui ait une galerie à filtrer, et laisse le marqueur vide ailleurs.
         Elle vient avec sa rangée de sous-étiquettes, repliée tant que « Image » n'est pas
         choisi. -->
    
  </div>
  <a href="./" class="site-logo" aria-label="Nicolas Delacrétaz, retour à l'accueil">
    <img class="logo-fallback" src="assets/logo/logo-poster.png" data-gif="assets/logo/logo.gif" width="124" height="124" alt="">
    <noscript><style>.logo-fallback[data-gif]{display:none}</style><img class="logo-fallback" src="assets/logo/logo.gif" width="124" height="124" alt=""></noscript>
    <canvas id="logo" width="180" height="180" aria-hidden="true" hidden></canvas>
  </a>
</header>

<!-- Le formulaire de contact vit ici, inerte, jusqu'à ce que `gallery.js` le clone au dos de la
     tuile retournée : un <template> n'est ni rendu, ni soumis, ni parcouru par les lecteurs d'écran. -->
<template id="contact-form-template">
<form class="contact-form" action="https://api.web3forms.com/submit" method="POST" data-key="b94933cb-7bd0-41ba-9986-ee2c4ccb145d">
  <input type="hidden" name="access_key" value="b94933cb-7bd0-41ba-9986-ee2c4ccb145d">
  <input type="hidden" name="subject" value="Contact nicodela.ch">
  <input type="hidden" name="redirect" value="https://nicodela.ch/merci.html">
  <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

  <!-- Seuls l'adresse et le message sont exigés : un visiteur qui écrit depuis son adresse
       professionnelle n'a rien d'autre à donner pour qu'on lui réponde. Les champs facultatifs ne
       portent donc aucune marque — c'est « (obligatoire) » qui signale l'exception. -->
  <!-- Un seul champ pour le nom, dans l'ordre où l'on se présente : « Nom / Prénom ». Deux
       champs pour la même chose obligeaient à choisir où écrire — et la moitié des visiteurs
       n'en remplissait qu'un. `autocomplete="name"` : le navigateur y verse le nom complet. -->
  <label>Nom / Prénom
    <input type="text" name="nom" autocomplete="name"></label>

  <label>Entreprise
    <input type="text" name="entreprise" autocomplete="organization"></label>

  <label>E-mail <span class="req">(obligatoire)</span>
    <input type="email" name="email" required autocomplete="email"></label>

  <label>Téléphone
    <input type="tel" name="telephone" autocomplete="tel"></label>

  <!-- Quatre lignes pour commencer : le champ grandit ensuite avec ce qu'on y écrit
       (`contact.js`), plutôt que de faire défiler un texte que l'on vient de taper. -->
  <label>Message <span class="req">(obligatoire)</span>
    <textarea name="message" rows="4" required></textarea></label>

  <button type="submit" class="btn btn-submit">Envoyer</button>
  <p class="form-error" hidden>L'envoi n'a pas abouti. Écrivez-moi directement à <a href="mailto:info@nicodela.com">info@nicodela.com</a>.</p>
</form>
<p class="form-success" hidden>Merci, votre message est envoyé. Je vous réponds rapidement.</p>

</template>
<!-- Les scripts de l'accueil : ils dépendent de ce que le site publie (réglage
     « publication »), et c'est `buildlib.publication` qui en tient l'ordre et les raisons. -->
<!-- La barre du lien actif : posée avant les autres modules, pour qu'elle soit en place
     dès que « Contact » ouvre sa carte sur l'accueil. -->
<script type="module" src="assets/js/nav.js"></script>
<script type="module" src="assets/js/logo.js"></script>
<!-- Les deux liens de l'en-tête deviennent des pastilles flottantes quand il quitte la fenêtre. -->
<script type="module" src="assets/js/nav-float.js"></script>
<script type="module" src="assets/js/masonry.js"></script>
<script type="module" src="assets/js/gallery.js"></script>
<!-- La veille : diaporama plein écran après un temps sans geste. Après la galerie, dont elle
     emprunte le voile et l'effacement de la grille ; elle ne s'envole que si rien n'est ouvert. -->
<script type="module" src="assets/js/veille.js"></script>
